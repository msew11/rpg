syntax = "proto3";
package rpg;
option csharp_namespace = "Rpg.Net.Message";

// 角色持有的基础道具实例，不重复传递静态配置。
message ItemPb {
  // 角色内唯一且不复用的实例编号。
  int64 instance_id = 1;
  // 道具配置编号。
  int32 item_id = 2;
  // 从零开始、按行排列的格子编号。
  int32 slot_index = 3;
  // 当前堆叠数量，装备为一。
  int32 count = 4;
}

// 独立版本的完整背包快照，空格不存记录。
message BagPb {
  // 每次成功变更递增的背包版本。
  int64 revision = 1;
  // 当前持有的全部物品实例。
  repeated ItemPb items = 2;
}

// 持久化成功后发送的完整背包。
message BagChangedNotice {
  // 快照所属角色。
  int64 role_id = 1;
  // 最新完整背包快照。
  BagPb bag = 2;
}

// 将当前角色的一份道具移动至目标格，由服务端决定合并或交换。
message MoveItem {
  // 必须与当前选中角色一致。
  int64 role_id = 1;
  // 被拖动的道具实例编号。
  int64 instance_id = 2;
  // 从零开始的目标格子编号。
  int32 target_slot_index = 3;
  // 拖动开始时的背包版本，过期请求不得执行。
  int64 expected_revision = 4;
}

// 移动执行结果，成功变更另经完整背包推送更新缓存。
message MoveItemRt {
  // 请求所属角色。
  int64 role_id = 1;
  // 请求的源实例编号。
  int64 instance_id = 2;
  // 请求的目标格子。
  int32 target_slot_index = 3;
  // 是否执行成功，拖回原格视为成功的无操作。
  bool success = 4;
  // 失败原因。
  string error = 5;
}

// 从背包丢弃指定数量，支持直接销毁，不接受客户端位置。
message DropItem {
  // 当前角色身份。
  int64 role_id = 1;
  // 背包中稳定实例编号。
  int64 instance_id = 2;
  // 本次丢弃的正整数数量。
  int32 count = 3;
  // 拿起时的背包版本，用于拒绝过期与重放请求。
  int64 expected_revision = 4;
  // 为真时直接销毁指定数量，不生成地面对象；默认仍为普通丢弃。
  bool destroy = 5;
}

// 丢弃响应，两侧状态仍经已有背包及 AOI 通知交付。
message DropItemRt {
  // 请求所属角色。
  int64 role_id = 1;
  // 被丢弃的源实例。
  int64 instance_id = 2;
  // 是否成功提交两侧内存。
  bool success = 3;
  // 失败原因。
  string error = 4;
  // 成功创建的地面对象 GUID，直接销毁时为空。
  string object_id = 5;
}

// 绑定当前移动意图，进入服务端拾取距离后整份取回背包。
message PickupItem {
  // 当前角色身份。
  int64 role_id = 1;
  // 地面对象稳定 GUID。
  string object_id = 2;
  // 点击时的对象版本。
  int64 expected_object_revision = 3;
  // 点击时的背包版本。
  int64 expected_bag_revision = 4;
  // 已先提交的走近移动序号。
  int64 move_action_id = 5;
}

// 最终拾取结果，状态仍由背包及 AOI 通知交付。
message PickupItemRt {
  // 请求所属角色。
  int64 role_id = 1;
  // 请求的地面对象。
  string object_id = 2;
  // 关联移动序号，区分先后操作。
  int64 move_action_id = 3;
  // 是否整份转移成功。
  bool success = 4;
  // 失败或取消原因。
  string error = 5;
}
