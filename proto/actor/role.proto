syntax = "proto3";
package rpg.actor;
option csharp_namespace = "Rpg.Server.ActorProtocol";
import "role.proto";
import "bag.proto";
import "map.proto";

// 查询接收角色当前所在地图的动态对象数量。
message GetRoleWorldObjectCount {
}

// 返回该角色所在地图的完整动态对象数量。
message GetRoleWorldObjectCountRt {
  // 所属地图返回的对象数量。
  int32 count = 1;
}

// 为已通过账号归属检查的角色准备数据。
message PrepareRole {
  // 可信摘要，首次建档使用身份与外观。
  rpg.RoleSummaryPb summary = 1;
}

// 完整角色、私有数据与初始范围。
message PrepareRoleRt {
  // 公开状态。
  rpg.RoleWorldStatePb state = 1;
  // 私有玩法数据。
  rpg.RolePb role = 2;
  // 完整私有物品。
  rpg.BagPb bag = 3;
  // 初始可见范围。
  rpg.MapAoiSnapshotPb map = 4;
}

// 使用服务器权威时间推进接收角色。
message AdvanceRole {
  // 本轮单调时间。
  int64 server_time_ms = 1;
  // 本轮有效速度。
  int32 movement_speed = 2;
}

// 角色是否仍需移动或投影重试。
message AdvanceRoleRt {
  // 后续轮次继续调度。
  bool moving = 1;
  // 在邮箱外进入物品串行入口完成拾取。
  bool pickup_ready = 2;
}

// 查询接收角色的最新完整物品。
message GetRoleItems {
}

message GetRoleItemsRt {
  int64 role_id = 1;
  rpg.BagPb bag = 2;
  rpg.RoleWorldEquipmentPb equipment = 3;
}

// 完成接收角色的待拾取意图，空结果表示待到达或已取消。
message CompleteRolePickup {
}

message CompleteRolePickupRt {
  rpg.PickupItemResultNotice result = 1;
}
