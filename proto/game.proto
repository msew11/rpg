syntax = "proto3";
package rpg;
option csharp_namespace = "Rpg.Net.Message";

// 包含协议类型、会话代次和序列化载荷的传输信封。
message Envelope {
  // 显式协议表中的完整协议名。
  string message_type = 1;
  // 区分已结束会话和当前会话的递增代次。
  int64 generation = 2;
  // 业务消息的 protobuf 字节。
  bytes payload = 3;
}

// 角色基础身体性别；未指定值不作为有效角色数据。
enum RoleGenderMessage {
  // 缺失或未知性别。
  ROLE_GENDER_MESSAGE_UNSPECIFIED = 0;
  // 男性身体。
  ROLE_GENDER_MESSAGE_MALE = 1;
  // 女性身体。
  ROLE_GENDER_MESSAGE_FEMALE = 2;
}

// 线上的角色快照，双方转换为各自独立的数据类。
message DataRoleMessage {
  // 唯一角色 ID。
  int64 role_id = 1;
  // 角色显示名称。
  string name = 2;
  // 当前等级。
  int32 level = 3;
  // 当前生命值。
  int32 health = 4;
  // 生命上限。
  int32 max_health = 5;
  // 当前魔力。
  int32 mana = 6;
  // 魔力上限。
  int32 max_mana = 7;
  // 当前经验。
  int32 experience = 8;
  // 升级所需经验。
  int32 next_experience = 9;
  // 逻辑横坐标。
  float x = 10;
  // 逻辑纵坐标。
  float y = 11;
  // 基础身体性别。
  RoleGenderMessage gender = 12;
  // 递增权威状态版本。
  int64 revision = 13;
  // 当前会话最后确认的移动序号。
  int64 acknowledged_action = 14;
}

// 使用演示账号登录。
message Login {
  // 演示用户名。
  string username = 1;
  // 演示密码。
  string password = 2;
}

// 登录结果及可选角色。
message LoginRt {
  // 是否成功。
  bool success = 1;
  // 失败原因。
  string error = 2;
  // 账号可选择的角色。
  repeated DataRoleMessage roles = 3;
}

// 请求进入指定角色会话。
message SelectRole {
  // 要选择的角色 ID。
  int64 role_id = 1;
}

// 选角结果和初始权威状态。
message SelectRoleRt {
  // 是否成功。
  bool success = 1;
  // 失败原因。
  string error = 2;
  // 请求选择的角色 ID，失败时也保留。
  int64 role_id = 3;
  // 成功后的初始角色状态。
  DataRoleMessage state = 4;
}

// 提交带序号的移动意图。
message Move {
  // 当前角色 ID。
  int64 role_id = 1;
  // 当前会话递增的移动序号。
  int64 action_id = 2;
  // 目标逻辑横坐标。
  float x = 3;
  // 目标逻辑纵坐标。
  float y = 4;
}

// 延迟移动确认，落盘成功后才返回成功。
message MoveRt {
  // 是否成功。
  bool success = 1;
  // 失败原因。
  string error = 2;
  // 请求的角色 ID。
  int64 role_id = 3;
  // 请求的移动序号。
  int64 action_id = 4;
  // 成功后的权威角色状态。
  DataRoleMessage state = 5;
}

// 服务端主动提交并落盘的角色状态。
message RoleStateNotice {
  // 最新权威快照。
  DataRoleMessage state = 1;
}
