syntax = "proto3";
package rpg;
option csharp_namespace = "Rpg.Net.Message";

import "role.proto";

// 提交带序号的移动意图。
message Move {
  // 当前角色 ID。
  int64 role_id = 1;
  // 当前会话递增的移动序号。
  int64 action_id = 2;
  // 目标逻辑横坐标。
  float x = 3;
  // 目标逻辑纵坐标。
  float y = 4;
}

// 延迟移动确认，内存提交成功后返回。
message MoveRt {
  // 是否成功。
  bool success = 1;
  // 失败原因。
  string error = 2;
  // 请求的角色 ID。
  int64 role_id = 3;
  // 请求的移动序号。
  int64 action_id = 4;
  // 成功后的权威角色位置。
  RoleWorldPositionPb position = 5;
}

// 服务端主动提交内存的角色状态。
message RoleStateNotice {
  // 最新权威快照。
  RoleWorldStatePb state = 1;
}

// 主动提交的角色资料。
message RoleProfileNotice {
  // 最新权威资料。
  RoleWorldProfilePb profile = 1;
}

// 主动提交的角色位置。
message RolePositionNotice {
  // 最新权威位置。
  RoleWorldPositionPb position = 1;
}

// 一块逻辑坐标，不包含地图身份。
message MapChunkCoordPb {
  // 横向块坐标。
  int32 x = 1;
  // 纵向块坐标。
  int32 y = 2;
}
// 怪物的基础存储载荷，行为另行扩展。
message MapMonsterPb {
  // 怪物类型标识。
  string monster_type_id = 1;
}
// 地面道具的基础存储载荷。
message MapGroundItemPb {
  // 道具配置编号。
  int32 item_id = 1;
  // 合法堆叠数量。
  int32 count = 2;
}
// 独立动态对象，更新始终携带完整状态。
message MapObjectPb {
  // 稳定的无连字符 GUID。
  string object_id = 1;
  // 对象自身的递增版本。
  int64 revision = 2;
  // 逻辑横坐标。
  float x = 3;
  // 逻辑纵坐标。
  float y = 4;
  // 两类载荷互斥。
  oneof payload {
    MapMonsterPb monster = 5;
    MapGroundItemPb ground_item = 6;
  }
}
// 一块完整对象快照，允许空列表。
message MapChunkPb {
  // 所属块坐标。
  MapChunkCoordPb coordinate = 1;
  // 完整对象列表。
  repeated MapObjectPb objects = 2;
}
// 客户端计算归属所需的服务器地图规格。
message MapLayoutPb {
  // 横向格子数。
  int32 width = 1;
  // 纵向格子数。
  int32 height = 2;
  // 逻辑格子边长。
  int32 tile_size = 3;
  // AOI 块单边格子数。
  int32 chunk_size_tiles = 4;
}
// 当前订阅完整快照，可跨过增量缺口恢复。
message MapAoiSnapshotPb {
  // 数值地图身份。
  int32 map_id = 1;
  // 观察者角色身份。
  int64 role_id = 2;
  // 此观察者实际发送的消息序号。
  int64 sequence = 3;
  // 分块规格。
  MapLayoutPb layout = 4;
  // 权威位置所在块。
  MapChunkCoordPb center = 5;
  // 完整有效九块或边缘裁剪范围。
  repeated MapChunkPb chunks = 6;
}
// 一次可原子应用的范围及对象增量。
message MapAoiDeltaPb {
  // 最新中心块。
  MapChunkCoordPb center = 1;
  // 新进入块的完整快照。
  repeated MapChunkPb entered_chunks = 2;
  // 离开订阅范围的块。
  repeated MapChunkCoordPb left_chunks = 3;
  // 保留块中的新增或更新对象。
  repeated MapObjectPb upsert_objects = 4;
  // 保留块中移出或删除的对象身份。
  repeated string removed_object_ids = 5;
}
// 初次快照或后续连续增量。
message MapAoiNotice {
  // 观察者角色身份。
  int64 role_id = 1;
  // 当前地图身份。
  int32 map_id = 2;
  // 会话内观察者消息序号。
  int64 sequence = 3;
  // 全量与增量互斥。
  oneof update {
    MapAoiSnapshotPb snapshot = 4;
    MapAoiDeltaPb delta = 5;
  }
}
// 仅申请当前权威范围，不允许客户端指定远处块。
message ResyncMapAoi {
  // 当前角色身份。
  int64 role_id = 1;
  // 当前地图身份。
  int32 map_id = 2;
}
// 重同步结果，成功时替换整个 AOI。
message ResyncMapAoiRt {
  // 是否成功。
  bool success = 1;
  // 错误说明。
  string error = 2;
  // 请求角色身份。
  int64 role_id = 3;
  // 请求地图身份。
  int32 map_id = 4;
  // 成功时的完整快照。
  MapAoiSnapshotPb snapshot = 5;
}
