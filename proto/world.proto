syntax = "proto3";
package rpg;
option csharp_namespace = "Rpg.Net.Message";

import "role.proto";

// 提交带序号的移动意图。
message Move {
  // 当前角色 ID。
  int64 role_id = 1;
  // 当前会话递增的移动序号。
  int64 action_id = 2;
  // 目标逻辑横坐标。
  float x = 3;
  // 目标逻辑纵坐标。
  float y = 4;
}

// 延迟移动确认，落盘成功后才返回成功。
message MoveRt {
  // 是否成功。
  bool success = 1;
  // 失败原因。
  string error = 2;
  // 请求的角色 ID。
  int64 role_id = 3;
  // 请求的移动序号。
  int64 action_id = 4;
  // 成功后的权威角色状态。
  RoleWorldStatePb state = 5;
}

// 服务端主动提交并落盘的角色状态。
message RoleStateNotice {
  // 最新权威快照。
  RoleWorldStatePb state = 1;
}
