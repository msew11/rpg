syntax = "proto3";
package rpg;
option csharp_namespace = "Rpg.Protocol";
import "role.proto";

// 首次定位账号分片的登录请求；不在其他账号请求重复提交 username。
message Login {
  // 入口统一去除首尾空白并转小写的账号键。
  string username = 1;
  // 演示账号密码，原样验证。
  string password = 2;
}

// 登录成功时返回账号可见角色摘要；失败使用 ErrorRt。
message LoginRt {
  // 该账号的可选角色，允许为空。
  repeated RoleSummaryPb roles = 1;
}

// 创建当前账号的角色摘要，三表在后续进入世界时创建。
message CreateRole {
  // 服务端去首尾空白并校验的角色名。
  string name = 1;
  // 基础身体性别。
  RoleGenderPb gender = 2;
  // 性别内头型编号。
  int32 head_id = 3;
}

// 创建成功后的完整可见角色列表。
message CreateRoleRt {
  // 不包含删除墓碑的摘要。
  repeated RoleSummaryPb roles = 1;
}

// 删除当前账号的角色摘要。
message DeleteRole {
  // 当前账号拥有的角色编号。
  int64 role_id = 1;
}

// 删除成功后的完整可见角色列表，允许为空。
message DeleteRoleRt {
  // 不包含删除墓碑的摘要。
  repeated RoleSummaryPb roles = 1;
}

// 撤销认证并返回登录，底层连接保留。
message SessionKickedNotice {
  // 显示给玩家的原因。
  string message = 1;
}
