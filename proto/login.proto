syntax = "proto3";
package rpg;
option csharp_namespace = "Rpg.Net.Message";

import "role.proto";

// 使用演示账号登录。
message Login {
  // 演示用户名。
  string username = 1;
  // 演示密码。
  string password = 2;
}

// 登录结果及可选角色。
message LoginRt {
  // 是否成功。
  bool success = 1;
  // 失败原因。
  string error = 2;
  // 账号可选择的角色简略信息。
  repeated RoleSummaryPb roles = 3;
}
