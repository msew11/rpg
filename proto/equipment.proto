syntax = "proto3";
package rpg;
option csharp_namespace = "Rpg.Net.Message";

// 与业务装备槽位保持一致的稳定传输编号。
enum EquipmentSlotPb {
  // 未指定槽位，不能作为有效目标。
  EQUIPMENT_SLOT_PB_UNSPECIFIED = 0;
  // 主手武器。
  EQUIPMENT_SLOT_PB_MAIN_HAND = 1;
  // 副手武器或盾牌。
  EQUIPMENT_SLOT_PB_OFF_HAND = 2;
  // 头部。
  EQUIPMENT_SLOT_PB_HEAD = 3;
  // 面部。
  EQUIPMENT_SLOT_PB_FACE = 4;
  // 身体。
  EQUIPMENT_SLOT_PB_BODY = 5;
  // 项链。
  EQUIPMENT_SLOT_PB_NECKLACE = 6;
  // 手部。
  EQUIPMENT_SLOT_PB_HANDS = 7;
  // 第一枚戒指。
  EQUIPMENT_SLOT_PB_RING1 = 8;
  // 裤子。
  EQUIPMENT_SLOT_PB_LEGS = 9;
  // 第二枚戒指。
  EQUIPMENT_SLOT_PB_RING2 = 10;
  // 鞋子。
  EQUIPMENT_SLOT_PB_FEET = 11;
}

// 一件独立穿戴实例，数量固定为一。
message EquippedItemPb {
  // 与背包共享的稳定物品编号。
  int64 instance_id = 1;
  // 静态道具配置编号。
  int32 item_id = 2;
  // 已占用的唯一装备槽位。
  EquipmentSlotPb slot = 3;
}

// 正实例编号表示从背包装备，零表示卸下目标装备槽。
message EquipItem {
  // 必须与当前角色一致。
  int64 role_id = 1;
  // 背包实例编号，零表示卸下。
  int64 instance_id = 2;
  // 明确指定主手或副手。
  EquipmentSlotPb slot = 3;
  // 物品拿起时的本人物品提交版本。
  int64 expected_bag_revision = 4;
  // 卸下可指定格子，缺省自动选择首个空格。
  optional int32 target_bag_slot = 5;
  // 拿起时的独立装备版本。
  int64 expected_equipment_revision = 6;
}

// 穿脱结果，成功状态经完整 RoleItemsChangedNotice 交付。
message EquipItemRt {
  // 请求所属角色。
  int64 role_id = 1;
  // 请求操作的装备槽位。
  EquipmentSlotPb slot = 2;
  // 是否完成原子转移。
  bool success = 3;
  // 失败原因，供界面显示。
  string error = 4;
}

// 可公开的完整穿戴状态，不依赖私有背包。
message RoleWorldEquipmentPb {
  // 穿戴者身份。
  int64 role_id = 1;
  // 仅随装备内容变化的独立版本。
  int64 revision = 2;
  // 已占用槽位，空列表表示全部卸下。
  repeated EquippedItemPb items = 3;
}
