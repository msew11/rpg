syntax = "proto3";
package rpg.v2;
option csharp_namespace = "Rpg.ProtocolV2";

// 首次定位账号分片的登录请求；不在其他账号请求重复提交 username。
message Login {
  // 入口统一去除首尾空白并转小写的账号键。
  string username = 1;
  // 供后续认证业务使用，框架不验证密码。
  string password = 2;
}

// 登录成功时返回账号可见角色摘要；失败使用 ErrorRt。
message LoginRt {
  // 该账号的可选角色，允许为空。
  repeated RoleSummaryPb roles = 1;
}

// 创建当前账号的角色摘要，三表在后续进入世界时创建。
message CreateRole {
  // 服务端去首尾空白并校验的角色名。
  string name = 1;
  // 基础身体性别。
  RoleGenderPb gender = 2;
  // 性别内头型编号。
  int32 head_id = 3;
}

// 创建成功后的完整可见角色列表。
message CreateRoleRt {
  // 不包含删除墓碑的摘要。
  repeated RoleSummaryPb roles = 1;
}

// 删除当前账号的角色摘要。
message DeleteRole {
  // 当前账号拥有的角色编号。
  int64 role_id = 1;
}

// 删除成功后的完整可见角色列表，允许为空。
message DeleteRoleRt {
  // 不包含删除墓碑的摘要。
  repeated RoleSummaryPb roles = 1;
}

// 摘要展示所用的角色性别。
enum RoleGenderPb {
  // 未指定性别。
  ROLE_GENDER_PB_UNSPECIFIED = 0;
  // 男性身体。
  ROLE_GENDER_PB_MALE = 1;
  // 女性身体。
  ROLE_GENDER_PB_FEMALE = 2;
}

// 账号下单个角色的展示摘要，不包含私有玩法数据。
message RoleSummaryPb {
  // 全局角色身份。
  int64 role_id = 1;
  // 显示名称。
  string name = 2;
  // 当前等级。
  int32 level = 3;
  // 基础身体性别。
  RoleGenderPb gender = 4;
  // 性别内头型编号。
  int32 head_id = 5;
  // 已穿戴物品的配置编号，仅供展示。
  repeated int32 equipped_items = 6;
}
