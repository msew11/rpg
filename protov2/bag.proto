syntax = "proto3";
package rpg.v2;
option csharp_namespace = "Rpg.ProtocolV2";
import "role.proto";
// 基于最新格子执行移动、合并或交换。
message MoveItem { int64 instance_id = 1; int32 target_slot_index = 2; }
message MoveItemRt { int64 role_id = 1; int64 instance_id = 2; int32 target_slot_index = 3; }
// 正实例穿戴，零卸下当前槽位。
message EquipItem { int64 instance_id = 1; EquipmentSlotPb slot = 2; optional int32 target_bag_slot = 3; }
message EquipItemRt { int64 role_id = 1; EquipmentSlotPb slot = 2; }
// 按最新持有数量丢弃或销毁，落点成对可选。
message DropItem { int64 instance_id = 1; int32 count = 2; bool destroy = 3; optional float drop_x = 4; optional float drop_y = 5; }
message DropItemRt { int64 role_id = 1; int64 instance_id = 2; string object_id = 3; }
// 接纳已经提交的走近动作，最终结果另行通知。
message PickupItem { string object_id = 1; uint64 move_action_id = 2; }
message PickupItemRt { int64 role_id = 1; string object_id = 2; uint64 move_action_id = 3; }

// 本人完整物品与装备一起接纳，不带物品版本。
message RoleItemsChangedNotice { int64 role_id = 1; BagPb bag = 2; RoleWorldEquipmentPb equipment = 3; }
// 只表示最终成功与失败，明确取消不推送。
message PickupItemResultNotice { int64 role_id = 1; string object_id = 2; uint64 move_action_id = 3; bool success = 4; }


// 完整私有物品集合。
message BagPb {
  // 包括背包与已穿戴实例，空格不存记录。
  repeated ItemPb items = 1;
}
// 一份角色私有物品实例。
message ItemPb {
  // 角色内稳定且不复用的实例编号。
  int64 instance_id = 1;
  // 道具配置编号。
  int32 item_id = 2;
  // 背包格编号，已穿戴固定零。
  int32 slot_index = 3;
  // 当前数量。
  int32 count = 4;
  // 是否已穿戴。
  bool equipped = 5;
  // 物品类型扩展。
  oneof payload {
    EquipmentPb equipment = 6;
  }
}
// 装备实例扩展，本批无额外网络字段。
message EquipmentPb {}
