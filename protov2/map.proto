syntax = "proto3";
package rpg.v2;
option csharp_namespace = "Rpg.ProtocolV2";

// 初始可见范围完整快照。
message MapAoiSnapshotPb {
  // 所属地图。
  int32 map_id = 1;
  // 坐标与分块规格。
  MapLayoutPb layout = 2;
  // 权威位置所在块。
  MapChunkCoordPb center = 3;
  // 中心及周围八块，按边缘裁剪并包含空块。
  repeated MapChunkPb chunks = 4;
}
// 地图逻辑规格。
message MapLayoutPb {
  // 横向格数。
  int32 width = 1;
  // 纵向格数。
  int32 height = 2;
  // 每格逻辑像素边长。
  int32 tile_size = 3;
  // 块的单边格数。
  int32 chunk_size_tiles = 4;
}
// 一块完整动态对象快照。
message MapChunkPb {
  // 块坐标。
  MapChunkCoordPb coordinate = 1;
  // 全部动态对象，允许空。
  repeated MapObjectPb objects = 2;
}
// 地图内块坐标。
message MapChunkCoordPb {
  // 横向块坐标。
  int32 x = 1;
  // 纵向块坐标。
  int32 y = 2;
}
// 完整动态对象。
message MapObjectPb {
  // 无连字符 GUID，N 格式。
  string object_id = 1;
  // 对象自身版本。
  int64 revision = 2;
  // 逻辑横坐标。
  float x = 3;
  // 逻辑纵坐标。
  float y = 4;
  // 对象载荷。
  oneof payload {
    MapMonsterPb monster = 5;
    MapGroundItemPb ground_item = 6;
  }
}
// 怪物基础展示，无行为。
message MapMonsterPb {
  // 怪物类型标识。
  string monster_type_id = 1;
}
// 地面物品基础展示。
message MapGroundItemPb {
  // 道具配置编号。
  int32 item_id = 1;
  // 地面数量。
  int32 count = 2;
}
