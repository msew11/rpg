syntax = "proto3";
package rpg.v2;
option csharp_namespace = "Rpg.ProtocolV2";

import "role.proto";
import "bag.proto";
import "map.proto";

// 进入当前账号拥有的角色。
message EnterWorld {
  // 要进入的角色编号。
  int64 role_id = 1;
}
// 进入成功所需完整初始数据。
message EnterWorldRt {
  // 完整公开状态。
  RoleWorldStatePb state = 1;
  // 本人私有玩法数据。
  RolePb role = 2;
  // 本人完整私有物品。
  BagPb bag = 3;
  // 初始可见范围。
  MapAoiSnapshotPb map = 4;
}

// 离开当前连接控制的角色世界，保留账号认证和连接。
message LeaveWorld {}
// 角色控制及在线成员已解除；重复离开同样成功。
message LeaveWorldRt {}

// 向当前绑定角色提交目标。
message Move {
  // 客户端递增动作编号。
  uint64 action_id = 1;
  // 期望移动目标。
  MoveTargetPb target = 2;
}
// 请求处理完成，权威进度由世界帧确认。
message MoveRt {
  // 原请求动作编号。
  uint64 action_id = 1;
}
// 请求当前角色完整观察状态。
message ResyncWorld {}
// 全量重同步回复。
message ResyncWorldRt {
  // 仅允许全量快照。
  WorldFramePb frame = 1;
}
// 服务器主动世界更新。
message WorldUpdateNotice {
  // 本次有序世界帧。
  WorldFramePb frame = 1;
}
// 观察者的权威世界帧。
message WorldFramePb {
  // 当前观察流递增编号。
  uint64 sequence = 1;
  // 服务器单调时间。
  int64 server_time_ms = 2;
  // 已处理的最新移动动作。
  uint64 acknowledged_action = 3;
  // 观察者本人位置。
  RolePositionUpdatePb self = 4;
  // 全量或增量更新。
  oneof update {
    WorldSnapshotPb snapshot = 5;
    WorldDeltaPb delta = 6;
  }
}
// 当前地图和其他可见玩家的完整快照。
message WorldSnapshotPb {
  // 完整地图范围。
  MapAoiSnapshotPb map = 1;
  // 其他玩家完整公开状态。
  repeated RoleWorldStatePb roles = 2;
}
// 本轮合并的观察变化。
message WorldDeltaPb {
  // 地图范围差集。
  MapAoiDeltaPb map = 1;
  // 新进入玩家。
  repeated RoleWorldStatePb entered_roles = 2;
  // 已离开玩家编号。
  repeated int64 left_role_ids = 3;
  // 持续可见玩家的位置组。
  repeated RolePositionUpdatePb moved_roles = 4;
}
