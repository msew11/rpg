name: Branch document ownership

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  branch-documents:
    name: Branch document ownership
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check main document ownership
        if: >-
          (github.event_name == 'push' && github.ref_name == 'main') ||
          (github.event_name == 'pull_request' && github.base_ref == 'main')
        shell: bash
        run: |
          set -euo pipefail
          for path in docs/architecture.md docs/game-vision.md docs/roadmap.md; do
            entry=$(git ls-tree HEAD -- "$path")
            if [[ -z "$entry" ]]; then
              echo "Development document must exist as an empty file on main: $path" >&2
              exit 1
            fi
            read -r mode type object tracked_path <<< "$entry"
            if [[ "$mode" != '100644' || "$type" != 'blob' || "$(git cat-file -s "$object")" -ne 0 ]]; then
              echo "Development document must be an empty regular file on main: $path" >&2
              exit 1
            fi
          done

      - name: Check develop shared documents
        if: >-
          (github.event_name == 'push' && github.ref_name == 'develop') ||
          (github.event_name == 'pull_request' && github.base_ref == 'develop')
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            +refs/heads/main:refs/remotes/origin/main
          if ! git diff --quiet origin/main HEAD -- AGENTS.md README.md; then
            echo 'AGENTS.md and README.md on develop must match the latest main.' >&2
            git diff --stat origin/main HEAD -- AGENTS.md README.md >&2
            exit 1
          fi
          if ! git diff --quiet origin/main HEAD -- scripts/core/; then
            echo 'scripts/core/ on develop must match the latest main.' >&2
            git diff --stat origin/main HEAD -- scripts/core/ >&2
            exit 1
          fi
          if ! git diff --quiet origin/main HEAD -- tests/core/; then
            echo 'tests/core/ on develop must match the latest main.' >&2
            git diff --stat origin/main HEAD -- tests/core/ >&2
            exit 1
          fi
